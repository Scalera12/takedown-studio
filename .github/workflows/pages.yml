name: Aperçu GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      # Variable du dépôt EN_LIGNE=oui : le site est servi sur takedownstudio.com (racine, indexable).
      # Sinon : aperçu sous /takedown-studio/, bloqué pour Google.
      - run: |
          if [ "${{ vars.EN_LIGNE }}" = "oui" ]; then export CHEMIN_BASE=""; else export CHEMIN_BASE="/${{ github.event.repository.name }}"; fi
          python3 construire-site.py
        env:
          SANS_CONSTRUCTION: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
